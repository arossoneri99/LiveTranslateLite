[translation]
; auto = Arabic-dominant speech -> English, otherwise -> Arabic
; ar   = always translate to Arabic
; en   = always translate to English
mode=auto

; Wait this long after captions change before sending to Google.
; Lower = faster/more requests. Higher = steadier sentences.
debounce_ms=350

[overlay]
width=1100
height=150
bottom_margin=90
font_size=34
opacity=225
hide_windows_live_captions=1
