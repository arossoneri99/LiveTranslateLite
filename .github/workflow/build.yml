name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/LiveTranslateLite.exe dist/
          Copy-Item config.ini dist/
          Compress-Archive -Path dist/* -DestinationPath LiveTranslateLite-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveTranslateLite-win-x64
          path: LiveTranslateLite-win-x64.zip
